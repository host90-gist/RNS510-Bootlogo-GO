name: Go tests

on:
  push:
    branches: [go-rewrite]
  pull_request:
    branches: [go-rewrite]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Fyne Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config xorg-dev libgl1-mesa-dev
      - run: go mod tidy
      - run: go test ./...
