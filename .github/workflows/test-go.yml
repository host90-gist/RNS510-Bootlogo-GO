name: Go tests

on:
  push:
    branches: [go-rewrite]
  pull_request:
    branches: [go-rewrite]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
